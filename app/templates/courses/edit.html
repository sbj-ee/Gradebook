{% extends "base.html" %}
{% block title %}Edit course{% endblock %}
{% block content %}
  <p><a href="{{ url_for('web.course_detail', course_id=course['id']) }}">&larr; Back to course</a></p>
  <h1>Edit course</h1>
  <form method="post" class="card">
    <label>Name
      <input name="name" value="{{ values.get('name', '') }}" required autofocus>
    </label>
    <label>Term
      <input name="term" value="{{ values.get('term', '') }}" placeholder="e.g. Fall 2026">
    </label>
    <label>Description
      <textarea name="description" rows="3">{{ values.get('description', '') }}</textarea>
    </label>
    <p class="muted">Category weights (whole percentages, must total 100).</p>
    <div class="weights">
      <label>Homework %
        <input type="number" name="homework_weight" min="0" max="100" value="{{ values.get('homework_weight', '') }}" required>
      </label>
      <label>Quizzes %
        <input type="number" name="quiz_weight" min="0" max="100" value="{{ values.get('quiz_weight', '') }}" required>
      </label>
      <label>Exams %
        <input type="number" name="exam_weight" min="0" max="100" value="{{ values.get('exam_weight', '') }}" required>
      </label>
    </div>
    <button type="submit">Save changes</button>
  </form>
{% endblock %}
