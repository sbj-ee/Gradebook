<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Gradebook">
  <!-- book cover -->
  <rect x="12" y="10" width="40" height="44" rx="5" fill="#4f46e5"/>
  <!-- page -->
  <rect x="18" y="16" width="30" height="32" rx="3" fill="#ffffff"/>
  <!-- grade marks: an A on a report -->
  <text x="33" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="22"
        font-weight="700" fill="#4f46e5" text-anchor="middle">A</text>
  <!-- spine -->
  <rect x="12" y="10" width="6" height="44" rx="3" fill="#3730a3"/>
</svg>
